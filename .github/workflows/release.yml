name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$GITHUB_REF_NAME' does not match required format vX.X.X" >&2
            exit 1
          fi
          if [ "$version" != "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Error: tag '$GITHUB_REF_NAME' does not match VERSION ($(tr -d '[:space:]' < VERSION))" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "-s -w" -o "dist/$3" .
          }
          build linux amd64 eyep
          build linux arm64 eyep-linux-arm64
          build darwin amd64 eyep-darwin-amd64
          build darwin arm64 eyep-darwin-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --notes "${{ github.event.repository.name }} ${{ github.ref_name }}"

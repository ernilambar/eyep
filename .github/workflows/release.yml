name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '${{ github.ref_name }}' does not match required format vX.X.X" >&2
            exit 1
          fi

      - name: Build binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/^VERSION=.*/VERSION=\"${version}\"/" eyep.sh > eyep
          chmod +x eyep

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" eyep --notes "${{ github.event.repository.name }} ${{ github.ref_name }}"
